{% extends "market_research/base_mr.html" %}
{% block title %}Eliminar {{ idea.name }}{% endblock %}
{% block content %}
<div class="card">
  <h2>¿Eliminar "{{ idea.name }}"?</h2>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Sí, eliminar</button>
    <a class="btn secondary" href="{{ idea.get_absolute_url }}">Cancelar</a>
  </form>
</div>
{% endblock %}
